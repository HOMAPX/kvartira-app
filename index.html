    },
    questions: function (focus) {
      var box = el('div'); box.style.display = 'grid'; box.style.gap = '10px';
      box.append(el('div', 'section-title', 'От ответов зависит, какие шаги нужны'));
      var l = el('div', 'list');
      D.anketa.forEach(function (q) {
        var r = el('div', 'qrow' + (focus === q.n ? ' hl' : '')); r.id = 'q-' + q.n;
        var h = el('div', 'q'); h.append(el('span', 'num', q.n + '  '), q.q); r.append(h);
        var a = el('div', 'a');
        if (q.a) { a.append(el('b', null, q.a)); if (q.o) a.append(el('div', 'sub', q.o)); }
        else a.append(el('span', 'chip c-wait', 'ждём ответа'));
        r.append(a); l.append(r);
      });
      box.append(l);
      box.append(el('div', 'foot', 'Ответы — в группу «Продажа квартиры»: текстом, голосом или фото документа.'));
      if (focus) setTimeout(function () { var t = document.getElementById('q-' + focus); if (t) t.scrollIntoView({ block: 'center' }); }, 30);
      return box;
    },
    flat: function () {
      var l = el('div', 'list');
      D.object.concat(D.conditions).forEach(function (c) {
        var r = el('div', 'kvrow'); var v = el('div'); v.append(c.v);
        if (c.o && c.v !== 'пока неизвестно') v.append(el('div', 'o', c.o));
        r.append(el('div', 'k', c.k), v); l.append(r);
      });
      return l;
    }
  };
  var openQ = D.anketa.filter(function (q) { return !q.a; }).length;
  if (openQ) { var bq = el('span', 'badge', String(openQ)); document.getElementById('tab-questions').append(bq); }

  function show(name, focus) {
    closeSheet();
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) { t.setAttribute('aria-selected', String(t.dataset.tab === name)); });
    view.innerHTML = ''; view.append(views[name](focus));
    try { localStorage.setItem('kv-tab', name); } catch (e) {}
  }
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
    t.addEventListener('click', function () { haptic(); show(t.dataset.tab); });
  });
  var start = 'now'; try { start = localStorage.getItem('kv-tab') || 'now'; } catch (e) {}
  show(views[start] ? start : 'now');
})();
</script>
</body>
</html>
