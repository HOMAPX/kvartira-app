* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.45; }

.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 12px; padding-top: 12px; }

button:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 8px; }

.fact .k { font-size: 12px; color: var(--hint); }

  background: var(--card); border-radius: 12px; padding: 4px; }
.tab { text-align: center; padding: 8px 4px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--hint); position: relative; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); }
.tab .badge { position: absolute; top: -5px; right: -1px; min-width: 17px; padding: 0 4px; border-radius: 9px; font-size: 10px;
  line-height: 17px; background: var(--flag); color: #fff; text-align: center; }

.section-title { font-size: 13px; color: var(--hint); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; margin: 6px 4px 0; }
.list { background: var(--card); border-radius: 14px; overflow: hidden; }
.row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 14px; width: 100%; }
.row + .row { border-top: 1px solid var(--sep); }

.row .title { font-weight: 500; }
.row .sub { font-size: 14px; color: var(--hint); margin-top: 2px; }
.row .chev { color: var(--hint); font-size: 18px; }
.row.item { grid-template-columns: 34px minmax(0, 1fr); align-items: start; }
.row.item .num { padding-top: 2px; }
.row .open { display: block; width: 100%; }
.a-row .chips { margin-top: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.c-done { background: var(--ok-bg); color: var(--ok); }
.c-work { background: var(--work-bg); color: var(--work); }
.c-wait { background: var(--wait-bg); color: var(--wait); }
.c-dep { background: var(--dep-bg); color: var(--dep); }

.stage-card { background: var(--card); border-radius: 14px; overflow: hidden; }

.ring circle { fill: none; stroke-width: 4; }

.ring .fgc { stroke: var(--ok); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
.ring text { font-size: 12px; font-weight: 700; fill: var(--fg); text-anchor: middle; dominant-baseline: central; }

  // Шапка
  var city = cond('Город');
  if (city && city.v !== 'пока неизвестно') document.getElementById('eyebrow').textContent = city.v;
  var st = document.getElementById('stage'); st.append('Сейчас: '); st.append(el('b', null, D.stage || '—'));
  var all = [], done = 0;
  D.stages.forEach(function (s) { s.items.forEach(function (i) { all.push(i); if (i.status === 'готово') done++; }); });
  var cur = null;
  D.stages.forEach(function (s) { if (cur === null && s.items.some(function (i) { return i.status !== 'готово'; })) cur = s.n; });
  var curStage = D.stages.filter(function (s) { return s.n === cur; })[0];
  // этапы для людей — с единицы: «этап 1 из 8»; номера пунктов (0.2) — как в чек-листе, это маркеры ответов
  function human(s) { return D.stages.indexOf(s) + 1; }
  var stepper = document.getElementById('stepper');
  D.stages.forEach(function (s) {
    var d = s.items.every(function (i) { return i.status === 'готово'; });
    stepper.append(el('i', d ? 'done' : (s === curStage ? 'cur' : null)));
  });
  var sl = document.getElementById('step-l');
  if (curStage) { sl.append('Этап ' + human(curStage) + ' из ' + D.stages.length + ' · '); sl.append(el('b', null, curStage.title)); }
  else sl.textContent = 'Все этапы пройдены';
  document.getElementById('step-r').textContent = 'готово ' + done + ' из ' + all.length;

  function facts() {
    var box = el('div', 'facts');
    [['Цена', 'Цена'], ['Задаток', 'Задаток'], ['Срок договора', 'Срок заключения основного договора']].forEach(function (p) {
      var c = cond(p[1]); var f = el('div', 'fact'); var v = c ? c.v.replace(/, договор задатка заключён/, '').replace(' RUB', ' ₽') : 'пока неизвестно';
      f.append(el('div', 'k', p[0]), el('div', 'v' + (v === 'пока неизвестно' ? ' na' : ''), v === 'пока неизвестно' ? 'неизвестно' : v));
      if (p[0] === 'Задаток') { var paid = cond('Дата внесения задатка'); if (paid && paid.v !== 'пока неизвестно') f.append(el('div', 'o', 'внесён ' + paid.v)); }
      box.append(f);
    });
    return box;
  }
  document.getElementById('built').textContent = 'обновлено ' + D.built.replace(/\.\d{4},/, ',');

  // «Прислать документ или ответ»: подпись — в буфер, затем открывается тема «сбор документов».
  // Файл Юля прикрепляет скрепкой Telegram — сообщение от её имени, его забирает telegram_inbox.py.
  function toast(t) {
    var n = el('div', 'toast', t); document.body.append(n);
    setTimeout(function () { n.remove(); }, 3500);
  }
  function copyText(t) {
    function fallback() {
      var a = el('textarea'); a.value = t; a.setAttribute('readonly', ''); a.style.position = 'fixed'; a.style.opacity = '0';
      document.body.append(a); a.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      a.remove(); return ok;
    }
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(t).then(function () { return true; }, fallback);
    }
    return Promise.resolve(fallback());
  }
  // Ответ — в личный чат с ботом: только туда Telegram умеет вставить текст (t.me/<бот>?text=…).
  // Маркер «А3 · …» уже стоит в поле ввода; бот по расписанию пересылает ответ в тему «сбор документов».
  function sendTo(caption) {
    var url = 'https://t.me/' + D.tg.bot + '?text=' + encodeURIComponent(caption + ' — ');
    try { if (inTg) tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
    toast('Открываю чат с ботом — номер уже в сообщении');
    setTimeout(function () {
      if (inTg) { try { tg.openTelegramLink(url); return; } catch (e) {} }
      window.open(url, '_blank');
    }, 500);
  }
  function short(s, n) { return s.length > n ? s.slice(0, n - 1).replace(/\s+\S*$/, '') + '…' : s; }

  // Лист с подробностями пункта
  var sheetOpen = null;
  function closeSheet() {
    if (!sheetOpen) return;
    sheetOpen.forEach(function (n) { n.remove(); }); sheetOpen = null;
    if (inTg) try { tg.BackButton.hide(); } catch (e) {}
    if (typeof updateMain === 'function') updateMain();
  }
  function openItem(i, stage) {
    haptic(); closeSheet();
    var back = el('div', 'sheet-back'); back.addEventListener('click', closeSheet);
    var sh = el('div', 'sheet'); sh.setAttribute('role', 'dialog'); sh.setAttribute('aria-modal', 'true');
    sh.append(el('div', 'grip'));
    sh.append(el('div', 'eyebrow', 'Этап ' + human(stage) + ' · пункт ' + i.n));
    sh.append(el('h2', null, i.what));
    var ch = chips(i); if (ch) sh.append(ch);
    if (i.status.indexOf(':') > 0) { var sk = el('div', 'kv'); sk.append(el('div', 'k', 'Статус'), el('div', null, i.status)); sh.append(sk); }
    if (i.where) { var w = el('div', 'kv'); w.append(el('div', 'k', 'Где / кто'), el('div', null, i.where)); sh.append(w); }
    if (i.when) { var wh = el('div', 'kv'); wh.append(el('div', 'k', 'Когда нужно'), el('div', null, i.when)); sh.append(wh); }
    if (i.refs.length) {
      var r = el('div', 'kv'); r.append(el('div', 'k', 'Зависит от ответа на вопрос'));
      var line = el('div');
      i.refs.forEach(function (ref, k) {
        var b = el('button', null, ref); b.style.color = 'var(--link)'; b.style.fontWeight = '600';
        b.addEventListener('click', function () { closeSheet(); show('questions', ref); });
        if (k) line.append(', '); line.append(b);
      });
      r.append(line); sh.append(r);
    }
    if (i.realtor) sh.append(el('div', 'note realtor', 'Документ из перечня риелтора — его нужно собрать.'));
    if (i.unverified && i.status !== 'готово') sh.append(el('div', 'note flag', 'Требование ещё проверяется. Пока не выполнять — сначала подтвердим, что именно и где нужно.'));
    if (stage.note) sh.append(el('div', 'note', stage.note));
    if (D.tg && i.status !== 'готово') {
      var s = el('button', 'send', '📎 Прислать документ или ответ');
      s.addEventListener('click', function () { sendTo('п. ' + i.n + ' · ' + short(i.what, 70)); });
      sh.append(s, el('div', 'send-hint', 'Откроется чат с ботом, номер пункта уже будет в сообщении. Допишите ответ или прикрепите файл — бот перешлёт в «сбор документов»'));
    }
    var c = el('button', 'close', 'Закрыть'); c.addEventListener('click', closeSheet); sh.append(c);
    document.body.append(back, sh); sheetOpen = [back, sh];
    if (inTg) try { tg.BackButton.show(); } catch (e) {}
    updateMain();
    c.focus();
  }
  if (inTg) try { tg.BackButton.onClick(closeSheet); } catch (e) {}
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  // строка пункта: текст открывает карточку; под ним — пометки слева и «Прислать» справа, как у вопросов
  function itemRow(i, stage) {
    var row = el('div', 'row item');
    var body = el('div');
    var b = el('button', 'open');
    b.append(el('div', 'title', i.what));
    if (i.where) b.append(el('div', 'sub', i.where));
    b.addEventListener('click', function () { openItem(i, stage); });
    body.append(b);
    var ch = chips(i), canSend = D.tg && i.status !== 'готово';
    if (ch || canSend) {
      var bar = el('div', 'a-row'); bar.append(ch || el('span'));
      if (canSend && /анкет/i.test(i.what)) {
        var qb = el('button', 'mini-send', 'К вопросам ›');
        qb.addEventListener('click', function () { haptic(); show('questions'); window.scrollTo(0, 0); });
        bar.append(qb);
      } else if (canSend) {
        var sb = el('button', 'mini-send', '📎 Прислать');
        sb.setAttribute('aria-label', 'Прислать документ или ответ по пункту ' + i.n);
        sb.addEventListener('click', function () { sendTo('п. ' + i.n + ' · ' + short(i.what, 70)); });
        bar.append(sb);
      }
      body.append(bar);
    }
    row.append(el('div', 'num', i.n), body);
    return row;
  }
  function ring(doneN, total, n) {
    var ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 30 30'); svg.setAttribute('class', 'ring');
    var r = 12, len = 2 * Math.PI * r;
    var a = document.createElementNS(ns, 'circle'); a.setAttribute('cx', 15); a.setAttribute('cy', 15); a.setAttribute('r', r); a.setAttribute('class', 'bgc');
    var b = document.createElementNS(ns, 'circle'); b.setAttribute('cx', 15); b.setAttribute('cy', 15); b.setAttribute('r', r); b.setAttribute('class', 'fgc');
    b.setAttribute('stroke-dasharray', (total ? len * doneN / total : 0) + ' ' + len);
    var t = document.createElementNS(ns, 'text'); t.setAttribute('x', 15); t.setAttribute('y', 15.5); t.textContent = n;
    svg.append(a, b, t); return svg;
  }

  var view = document.getElementById('view');
  var views = {
    now: function () {
      var box = el('div'); box.style.display = 'grid'; box.style.gap = '10px';
      var stage = D.stages.filter(function (s) { return s.n === cur; })[0];
      if (stage) {
        box.append(el('div', 'section-title', 'Что нужно сейчас — этап ' + human(stage) + '. ' + stage.title));
        if (stage.note) box.append(el('div', 'card stage-note', stage.note));
        var l = el('div', 'list');
        stage.items.forEach(function (i) { if (i.status !== 'готово') l.append(itemRow(i, stage)); });
        box.append(l);
      }
      var rl = all.filter(function (i) { return i.realtor; }), rd = rl.filter(function (i) { return i.status === 'готово'; }).length;
      if (rl.length) {
        box.append(el('div', 'section-title', 'Документы по списку риелтора — собрано ' + rd + ' из ' + rl.length));
        var l2 = el('div', 'list');
        D.stages.forEach(function (s) { s.items.forEach(function (i) { if (i.realtor) l2.append(itemRow(i, s)); }); });
        box.append(l2);
      }
      var open = openQ;
      if (open) {
        var q = el('button', 'card row'); q.style.gridTemplateColumns = 'minmax(0,1fr) auto';
        var t = el('div'); t.append(el('div', 'title', 'Вопросы о квартире без ответа: ' + open), el('div', 'sub', 'От ответов зависит, какие шаги нужны'));
        q.append(t, el('div', 'chev', '›')); q.addEventListener('click', function () { show('questions'); });
        box.append(q);
      }
      return box;
    },
    stages: function () {
      var box = el('div'); box.style.display = 'grid'; box.style.gap = '10px';
      D.stages.forEach(function (s) {
        var d = s.items.filter(function (i) { return i.status === 'готово'; }).length;
        var card = el('div', 'stage-card' + (s.n === cur ? ' cur' : ''));
        var head = el('button', 'stage-head'); head.setAttribute('aria-expanded', s.n === cur ? 'true' : 'false');
        var mid = el('div'); mid.append(el('div', 't', s.title), el('div', 's', 'готово ' + d + ' из ' + s.items.length));
        head.append(ring(d, s.items.length, human(s)), mid, el('div', 'chev', s.n === cur ? '⌄' : '›'));
        var body = el('div', 'stage-body'); body.hidden = s.n !== cur;
        if (s.note) body.append(el('div', 'stage-note', s.note));
        s.items.forEach(function (i) { body.append(itemRow(i, s)); });
        head.addEventListener('click', function () {
          haptic(); body.hidden = !body.hidden; head.setAttribute('aria-expanded', String(!body.hidden));
          head.lastChild.textContent = body.hidden ? '›' : '⌄';
        });
        card.append(head, body); box.append(card);
      });
      return box;
    },
    questions: function (focus) {
      var box = el('div'); box.style.display = 'grid'; box.style.gap = '10px';
      function qrow(q) {
        var r = el('div', 'qrow' + (focus === q.n ? ' hl' : '')); r.id = 'q-' + q.n;
        var h = el('div', 'q'); h.append(el('span', 'num', q.n + '  '), q.q); r.append(h);
        var needs = !q.a || q.clarify;
        if (q.h && needs) r.append(el('div', 'hint', '💡 ' + q.h));
        // неполный ответ: показываем, что уже получено, и что уточнить
        if (q.clarify) r.append(el('div', 'hint', '✉️ Получено: ' + q.a.split(' — уточнить')[0]));
        var a = el('div', 'a');
        if (!needs) { a.append(el('b', null, q.a.replace(/н\/д/g, 'пока неизвестно'))); if (q.o) a.append(el('div', 'sub', q.o)); }
        else {
          // метка от бота: ответ пришёл, текст появится после проверки
          if (q.got) a.append(el('span', 'chip c-done', 'ответ получен ✓'));
          else if (q.clarify) a.append(el('span', 'chip c-flag', 'нужно уточнить'));
          else a.append(el('span', 'chip c-wait', 'ждём ответа'));
          if (D.tg) {
            var sb = el('button', 'mini-send', '✏️ Ответить');
            sb.addEventListener('click', function () { haptic(); sendTo(q.n + ' · ' + short(q.q, 70)); });
            a.classList.add('a-row'); a.append(sb);
          }
        }
        r.append(a); return r;
      }
      var openList = D.anketa.filter(function (q) { return !q.a || q.clarify; }), doneList = D.anketa.filter(function (q) { return q.a && !q.clarify; });
      if (openList.length) {
        box.append(el('div', 'section-title', 'Ждут ответа — ' + openList.length + '. От них зависит, какие шаги нужны'));
        var l = el('div', 'list'); openList.forEach(function (q) { l.append(qrow(q)); }); box.append(l);
      }
      if (doneList.length) {
        var det = el('details', 'fold'); det.append(el('summary', null, 'Отвечено — ' + doneList.length));
        var l2 = el('div', 'list'); doneList.forEach(function (q) { l2.append(qrow(q)); }); det.append(l2);
        if (doneList.some(function (q) { return q.n === focus; })) det.open = true;
        box.append(det);
      }
      box.append(el('div', 'foot', '«Ответить» откроет чат с ботом, номер вопроса уже будет в сообщении — допишите ответ, можно приложить фото документа. Бот перешлёт в тему «сбор документов».'));
      if (focus) setTimeout(function () { var t = document.getElementById('q-' + focus); if (t) t.scrollIntoView({ block: 'center' }); }, 30);
      return box;
    },
    flat: function () {
      var box = el('div'); box.style.display = 'grid'; box.style.gap = '10px';
      var fc = el('div', 'card'); fc.append(facts()); box.append(fc);
      var rows = D.object.concat(D.conditions).filter(function (c) { return !/^(Цена|Задаток|Срок заключения|Дата внесения задатка)/.test(c.k); });
      function kv(c) {
        var r = el('div', 'kvrow'); var v = el('div', c.v === 'пока неизвестно' ? 'v-na' : null); v.append(c.v.replace(/н\/д/g, 'пока неизвестно'));
        if (c.o && c.v !== 'пока неизвестно') v.append(el('div', 'o', c.o));
        r.append(el('div', 'k', c.k), v); return r;
      }
      var known = rows.filter(function (c) { return c.v !== 'пока неизвестно'; }), unknown = rows.filter(function (c) { return c.v === 'пока неизвестно'; });
      if (known.length) { var l = el('div', 'list'); known.forEach(function (c) { l.append(kv(c)); }); box.append(l); }
      if (unknown.length) {
        var det = el('details', 'fold'); det.append(el('summary', null, 'Пока неизвестно — ' + unknown.length));
        var l2 = el('div', 'list'); unknown.forEach(function (c) { l2.append(kv(c)); }); det.append(l2); box.append(det);
      }
      return box;
    }
  };
  // на значке — сколько вопросов ещё ждут действия Юли: без ответа или «уточнить», и ответ ещё не пришёл
  var openQ = D.anketa.filter(function (q) { return (!q.a || q.clarify) && !q.got; }).length;
  if (openQ) { var bq = el('span', 'badge', String(openQ)); document.getElementById('tab-questions').append(bq); }

  // Нативная кнопка Telegram внизу: на вкладке «Вопросы» — прислать документ, на остальных — к вопросам
  var curTab = 'now', mainHandler = null;
  function updateMain() {
    if (!inTg) return;
    try {
      var mb = tg.MainButton;
      if (mainHandler) mb.offClick(mainHandler);
      if (sheetOpen) { mb.hide(); return; }
      if (curTab === 'questions' || !openQ) {
        if (!D.tg) { mb.hide(); return; }
        mainHandler = function () { sendTo('Документ'); };
        mb.setText('📎 Прислать документ');
      } else {
        mainHandler = function () { haptic(); show('questions'); window.scrollTo(0, 0); };
        mb.setText('Ответить на вопросы · ' + openQ);
      }
      mb.onClick(mainHandler); mb.show();
    } catch (e) {}
  }

  function show(name, focus) {
    closeSheet(); curTab = name;
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) { t.setAttribute('aria-selected', String(t.dataset.tab === name)); });
    view.innerHTML = ''; view.append(views[name](focus));
    updateMain();
    try { localStorage.setItem('kv-tab', name); } catch (e) {}
  }
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
    t.addEventListener('click', function () { haptic(); show(t.dataset.tab); });
  });
  var start = 'now'; try { start = localStorage.getItem('kv-tab') || 'now'; } catch (e) {}
  show(views[start] ? start : 'now');
})();
</script>
</body>
</html>
